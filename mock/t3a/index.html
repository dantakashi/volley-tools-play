<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#071b3a">
  <title>試合アシスタント モック</title>
  <!--
    目次
    §1 基本・レイアウト
    §2 得点カラム
    §3 中央カラム
    §4 モーダル・通知
    §5 画面本体
    §6 状態と描画
    §7 得点・ローテーション
    §8 選手交代
    §9 戻す・やり直し
  -->
  <style>
    /* §1 基本・レイアウト */
    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      --bg: #071b3a; --panel: #0d2a52; --panel2: #123561; --line: #31547e;
      --blue: #36a9ff; --blue2: #126ab0; --red: #ff6473; --red2: #a73143;
      --muted: #acc2dc; --yellow: #ffd85e;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-width: 900px; height: 100%; background: var(--bg); color: #fff; }
    body { overflow: hidden; }
    button { min-height: 48px; font: inherit; color: inherit; cursor: pointer; }
    button:focus-visible { outline: 3px solid #ffe36e; outline-offset: 2px; }
    button:disabled { cursor: default; opacity: .38; }
    .mock-banner {
      height: 24px; display: grid; place-items: center; background: #f0b429; color: #182231;
      font-size: 12px; font-weight: 900; letter-spacing: .04em;
    }
    .topbar {
      height: 56px; display: flex; align-items: center; justify-content: center; gap: 24px;
      padding: 5px 16px; background: #0a2447; border-bottom: 1px solid var(--line);
    }
    .set-label { font-weight: 900; color: #dceafb; }
    .score { min-width: 150px; text-align: center; font-size: 34px; line-height: 1; font-weight: 950; }
    .score-part { display: inline-block; transition: color .2s, transform .2s; }
    .score-part.bump { color: #8ed4ff; transform: scale(1.25); }
    #theirScore.bump { color: #ff9ca7; }
    .serve-badge { padding: 7px 14px; border-radius: 999px; background: #24598c; font-weight: 900; }
    .app {
      height: calc(100vh - 80px); display: grid; grid-template-columns: 28% 44% 28%;
      overflow: hidden;
    }
    .side { min-width: 0; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
    .ours { background: rgba(18, 106, 176, .16); border-right: 1px solid #297ec0; }
    .theirs { background: rgba(167, 49, 67, .14); border-left: 1px solid #9b4050; }
    .side h1 { margin: 0; text-align: center; font-size: 20px; }

    /* §2 得点カラム */
    .actions { flex: 1; min-height: 0; display: grid; grid-auto-rows: minmax(48px, 1fr); gap: 8px; }
    .action {
      border: 0; border-radius: 11px; padding: 6px 12px; font-size: clamp(15px, 1.45vw, 20px);
      line-height: 1.18; font-weight: 900;
    }
    .ours .action { background: var(--blue2); }
    .theirs .action { background: var(--red2); }
    .substitution-wrap { padding-top: 9px; border-top: 1px solid #5f7188; }
    .substitution {
      width: 100%; border: 1px solid #6f8299; border-radius: 11px; background: #354b64; font-weight: 900;
    }

    /* §3 中央カラム */
    .center {
      min-width: 0; padding: 9px 10px; display: grid; grid-template-rows: auto auto minmax(0, 1fr) auto;
      gap: 8px; background: #081f40;
    }
    .card { border: 1px solid var(--line); border-radius: 11px; background: var(--panel); }
    .section-title { margin: 0 0 6px; font-size: 15px; color: #d9e9fa; }
    .rotation-card { position: relative; padding: 8px; transition: box-shadow .2s, border-color .2s; }
    .rotation-card.flash { border-color: var(--yellow); box-shadow: 0 0 0 3px rgba(255,216,94,.35), 0 0 24px rgba(255,216,94,.25); }
    .rotation-badge {
      position: absolute; top: 7px; right: 8px; min-width: 40px; padding: 3px 8px;
      border-radius: 999px; background: var(--blue); color: #061a37; text-align: center; font-weight: 950;
    }
    .net { margin: 0 48px 5px 0; border-top: 3px solid #f4f8fc; text-align: center; color: var(--muted); font-size: 10px; }
    .court { display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(2, 50px); gap: 5px; }
    .court-player {
      display: grid; place-items: center; padding: 2px; border: 1px solid #4385ba; border-radius: 7px;
      background: #104875; text-align: center; font-size: 13px; font-weight: 900;
    }
    .court-player.libero-slot { border-color: #e2ac42; background: #6c541d; }
    .court-player small { display: block; color: #f8dc95; font-size: 10px; line-height: 1.05; }
    .libero-note { margin: 4px 0 0; color: var(--muted); text-align: center; font-size: 10px; }
    .serve-order { padding: 7px 8px; }
    .serve-chips { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; }
    .serve-chip {
      position: relative; min-width: 0; min-height: 52px; display: grid; place-items: center; padding: 14px 2px 2px;
      border: 1px solid #54779e; border-radius: 8px; background: #173b63; text-align: center;
      font-size: 11px; font-weight: 900;
    }
    .serve-chip.active { border-color: #74c8ff; background: #165d92; box-shadow: inset 0 0 0 2px #36a9ff; }
    .chip-badge {
      position: absolute; top: 2px; left: 50%; transform: translateX(-50%); padding: 1px 5px;
      border-radius: 999px; background: var(--yellow); color: #182231; white-space: nowrap; font-size: 9px;
    }
    .log-card { min-height: 0; display: flex; flex-direction: column; padding: 8px; }
    .log { min-height: 0; overflow-y: auto; margin: 0; padding: 0; list-style: none; font-size: 13px; }
    .log li { padding: 6px 7px; border-bottom: 1px solid rgba(80,116,154,.48); }
    .log li.system { color: var(--yellow); font-weight: 800; }
    .dot { font-size: 17px; vertical-align: -1px; }
    .dot.our { color: var(--blue); } .dot.their { color: var(--red); }
    .history-controls { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .history-controls button { border: 1px solid #6687aa; border-radius: 10px; background: #173859; font-weight: 900; }

    /* §4 モーダル・通知 */
    .backdrop { position: fixed; z-index: 20; inset: 0; display: none; place-items: center; padding: 20px; background: rgba(0,8,23,.82); }
    .backdrop.show { display: grid; }
    .modal { width: min(860px, 94vw); padding: 18px; border: 1px solid #638bb5; border-radius: 15px; background: #0b274a; }
    .modal h2 { margin: 0 0 6px; }
    .modal-note { margin: 0 0 12px; color: var(--muted); }
    .player-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 9px; }
    .player-choice { border: 1px solid #4385ba; border-radius: 10px; background: #104875; font-weight: 900; }
    .player-choice .number { display: block; font-size: 21px; }
    .modal-footer { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; }
    .modal-footer button { min-width: 100px; border: 0; border-radius: 9px; background: #354b64; font-weight: 900; }
    #toast {
      position: fixed; z-index: 30; left: 50%; bottom: 18px; transform: translate(-50%, 18px);
      min-width: 330px; max-width: 90vw; padding: 13px 18px; border-radius: 10px; background: #fff;
      color: #061a37; text-align: center; font-weight: 900; opacity: 0; pointer-events: none;
      transition: opacity .18s, transform .18s;
    }
    #toast.show { opacity: 1; transform: translate(-50%, 0); }
  </style>
</head>
<body>
  <!-- §5 画面本体 -->
  <div class="mock-banner">これはモックです。とじると消えます</div>
  <header class="topbar">
    <span class="set-label">セット1</span>
    <div class="score" aria-label="スコア"><span id="ourScore" class="score-part">0</span> - <span id="theirScore" class="score-part">0</span></div>
    <span id="serveBadge" class="serve-badge">🏐 相手のサーブ</span>
  </header>
  <main class="app">
    <section class="side ours">
      <h1>うちの得点</h1>
      <div id="ourActions" class="actions"></div>
    </section>

    <section class="center">
      <section id="rotationCard" class="card rotation-card">
        <h2 class="section-title">いまのローテ</h2>
        <span id="rotationBadge" class="rotation-badge">S1</span>
        <div class="net">ネット側 ↑</div>
        <div id="court" class="court"></div>
        <p class="libero-note">リベロはサーブしません</p>
      </section>
      <section class="card serve-order">
        <h2 class="section-title">サーブ順</h2>
        <div id="serveChips" class="serve-chips"></div>
      </section>
      <section class="card log-card">
        <h2 class="section-title">試合ログ</h2>
        <ol id="log" class="log" aria-live="polite"></ol>
      </section>
      <div class="history-controls">
        <button id="undo" type="button" disabled>↩ 戻す</button>
        <button id="redo" type="button" disabled>↪ やり直し</button>
      </div>
    </section>

    <section class="side theirs">
      <h1>相手の得点</h1>
      <div id="theirActions" class="actions"></div>
      <div class="substitution-wrap"><button id="substitution" class="substitution" type="button">🔁 選手交代</button></div>
    </section>
  </main>

  <div id="modalBackdrop" class="backdrop" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <section class="modal">
      <h2 id="modalTitle"></h2>
      <p id="modalNote" class="modal-note"></p>
      <div id="modalGrid" class="player-grid"></div>
      <div class="modal-footer"><button id="modalClose" type="button">閉じる</button></div>
    </section>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>

  <script>
    'use strict';

    // §6 状態と描画
    const players = {
      1:'はると', 2:'そうた', 3:'ゆうき', 4:'りく', 5:'いつき', 6:'あおい',
      7:'れん', 8:'かなた', 9:'だいち', 10:'みなと', 11:'こうき', 12:'たくみ'
    };
    const initialState = {
      ourScore: 0, theirScore: 0, ourServe: false, rotation: 1,
      order: [4, 9, 12, 1, 5, 10], bench: [2, 3, 6, 8, 11], logs: []
    };
    const clone = value => JSON.parse(JSON.stringify(value));
    let state = clone(initialState);
    let undoStack = [];
    let redoStack = [];
    let pendingScore = null;
    let substitutionOut = null;
    let toastTimer = 0;

    const $ = selector => document.querySelector(selector);
    const label = number => `#${number}${players[number]}`;

    function showToast(message) {
      clearTimeout(toastTimer);
      $('#toast').textContent = message;
      $('#toast').classList.add('show');
      toastTimer = setTimeout(() => $('#toast').classList.remove('show'), 1500);
    }

    function commit(mutator) {
      undoStack.push(clone(state));
      redoStack = [];
      mutator();
      render();
    }

    function courtNumbers() {
      return [state.order[1], state.order[2], state.order[3], state.order[0], state.order[5], state.order[4]];
    }

    function currentServer() { return state.order[0]; }

    function renderActions() {
      const our = [
        ['アタック決定', true], ['ブロック', true], ['相手のミス', false]
      ];
      const their = [
        ['相手に決められた', false], ['アタックのミス', true], ['レシーブ・つなぎのミス', true]
      ];
      if (state.ourServe) {
        our.push(['サーブエース', false]);
        their.push(['サーブミス', false]);
      }
      const fill = (root, actions, side) => {
        root.replaceChildren(...actions.map(([name, needsPlayer]) => {
          const button = document.createElement('button');
          button.type = 'button';
          button.className = 'action';
          button.textContent = name;
          button.addEventListener('click', () => beginScore(side, name, needsPlayer));
          return button;
        }));
      };
      fill($('#ourActions'), our, 'our');
      fill($('#theirActions'), their, 'their');
    }

    function renderCourt() {
      const numbers = courtNumbers();
      $('#court').replaceChildren(...numbers.map((number, index) => {
        const box = document.createElement('div');
        const liberoSlot = index === 4;
        box.className = `court-player${liberoSlot ? ' libero-slot' : ''}`;
        if (liberoSlot) {
          box.innerHTML = `<span>#7 れん (L)<small>⇄ ${label(number)}</small></span>`;
        } else {
          box.textContent = label(number);
        }
        return box;
      }));
    }

    function renderServeOrder() {
      const active = currentServer();
      $('#serveChips').replaceChildren(...state.order.map(number => {
        const chip = document.createElement('div');
        chip.className = `serve-chip${number === active ? ' active' : ''}`;
        const badge = document.createElement('span');
        badge.className = 'chip-badge';
        badge.textContent = state.ourServe && number === active ? '🏐サーブ中' : (!state.ourServe && number === active ? '🏐つぎ' : '');
        if (badge.textContent) chip.append(badge);
        chip.append(document.createTextNode(label(number)));
        return chip;
      }));
    }

    function renderLog() {
      $('#log').replaceChildren(...state.logs.map(entry => {
        const item = document.createElement('li');
        if (entry.system) {
          item.className = 'system';
          item.textContent = entry.text;
        } else {
          item.innerHTML = `${entry.score} <span class="dot ${entry.side}">${entry.side === 'our' ? '●' : '○'}</span> ${entry.text}`;
        }
        return item;
      }));
      $('#log').scrollTop = 0;
    }

    function render(flashSide) {
      $('#ourScore').textContent = state.ourScore;
      $('#theirScore').textContent = state.theirScore;
      $('#serveBadge').textContent = state.ourServe ? '🏐 うちのサーブ' : '🏐 相手のサーブ';
      $('#rotationBadge').textContent = `S${state.rotation}`;
      $('#undo').disabled = undoStack.length === 0;
      $('#redo').disabled = redoStack.length === 0;
      renderActions();
      renderCourt();
      renderServeOrder();
      renderLog();
      if (flashSide) {
        const score = flashSide === 'our' ? $('#ourScore') : $('#theirScore');
        score.classList.remove('bump');
        void score.offsetWidth;
        score.classList.add('bump');
        setTimeout(() => score.classList.remove('bump'), 320);
      }
    }

    function openModal(title, note, numbers, onChoose) {
      $('#modalTitle').textContent = title;
      $('#modalNote').textContent = note;
      $('#modalGrid').replaceChildren(...numbers.map(number => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'player-choice';
        button.innerHTML = `<span class="number">#${number}</span>${players[number]}${number === 7 ? '（リベロ）' : ''}`;
        button.addEventListener('click', () => onChoose(number));
        return button;
      }));
      $('#modalBackdrop').classList.add('show');
    }

    function closeModal() {
      $('#modalBackdrop').classList.remove('show');
      pendingScore = null;
      substitutionOut = null;
    }

    // §7 得点・ローテーション
    function beginScore(side, action, needsPlayer) {
      if (!needsPlayer) {
        const automaticPlayer = action === 'サーブエース' || action === 'サーブミス' ? currentServer() : null;
        recordScore(side, action, automaticPlayer);
        return;
      }
      pendingScore = { side, action };
      const onCourt = [...state.order, 7];
      openModal(`${action}：選手を選んでください`, 'いまコートにいる7人だけを表示しています', onCourt, number => {
        const pending = pendingScore;
        closeModal();
        recordScore(pending.side, pending.action, number);
      });
    }

    function recordScore(side, action, playerNumber) {
      const wasOpponentServe = !state.ourServe;
      let rotated = false;
      commit(() => {
        if (side === 'our') {
          state.ourScore += 1;
          if (wasOpponentServe) {
            state.order.push(state.order.shift());
            state.rotation = state.rotation % 6 + 1;
            rotated = true;
          }
          state.ourServe = true;
        } else {
          state.theirScore += 1;
          state.ourServe = false;
        }
        const who = playerNumber ? ` ${label(playerNumber)}` : '';
        state.logs.unshift({
          system: false, side,
          score: `${state.ourScore}-${state.theirScore}`,
          text: `${action}${who}`
        });
        if (rotated) {
          state.logs.unshift({
            system: true,
            text: `— サイドアウト！ ローテを回す → S${state.rotation} ／ つぎのサーブ: ${label(currentServer())}`
          });
        }
      });
      if (rotated) {
        $('#rotationCard').classList.add('flash');
        setTimeout(() => $('#rotationCard').classList.remove('flash'), 1000);
      }
      render(side);
      showToast(`記録: ${action}${playerNumber ? ` ${label(playerNumber)}` : ''}`);
    }

    // §8 選手交代
    function beginSubstitution() {
      openModal('コートから出る選手', 'リベロ交代はこのモックの対象外です', state.order, outNumber => {
        substitutionOut = outNumber;
        openModal('入る選手', 'ベンチの選手だけを表示しています', state.bench, inNumber => {
          const out = substitutionOut;
          closeModal();
          commit(() => {
            const orderIndex = state.order.indexOf(out);
            const benchIndex = state.bench.indexOf(inNumber);
            state.order[orderIndex] = inNumber;
            state.bench[benchIndex] = out;
            state.logs.unshift({ system: true, text: `— 交代: ${label(out)} → ${label(inNumber)}` });
          });
          showToast(`交代: ${label(out)} → ${label(inNumber)}`);
        });
      });
    }

    // §9 戻す・やり直し
    function undo() {
      if (!undoStack.length) return;
      redoStack.push(clone(state));
      state = undoStack.pop();
      render();
      showToast('1つ前の状態に戻しました');
    }
    function redo() {
      if (!redoStack.length) return;
      undoStack.push(clone(state));
      state = redoStack.pop();
      render();
      showToast('やり直しました');
    }

    $('#substitution').addEventListener('click', beginSubstitution);
    $('#undo').addEventListener('click', undo);
    $('#redo').addEventListener('click', redo);
    $('#modalClose').addEventListener('click', closeModal);
    $('#modalBackdrop').addEventListener('click', event => { if (event.target === $('#modalBackdrop')) closeModal(); });
    document.addEventListener('keydown', event => { if (event.key === 'Escape') closeModal(); });
    render();
  </script>
</body>
</html>
