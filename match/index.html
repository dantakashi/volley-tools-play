<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#071b3a">
  <link rel="manifest" href="manifest.webmanifest">
  <title>試合アシスタント</title>
  <style>
    :root{color-scheme:dark;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;--bg:#071b3a;--panel:#0d2a52;--line:#31547e;--blue:#36a9ff;--blue2:#126ab0;--red:#ff6473;--red2:#a73143;--muted:#acc2dc;--yellow:#ffd85e}
    *{box-sizing:border-box}html,body{margin:0;min-width:0;height:100%;background:var(--bg);color:#fff}body{overflow-x:hidden;overflow-y:auto}body:has(#recordShell:not([hidden])){min-width:900px;overflow-x:auto;overflow-y:hidden}
    button{min-height:44px;font:inherit;color:inherit;cursor:pointer}button:focus-visible{outline:3px solid #ffe36e;outline-offset:2px}button:disabled{cursor:default;opacity:.38}
    .topbar{height:56px;display:flex;align-items:center;justify-content:center;gap:20px;padding:4px 16px;background:#0a2447;border-bottom:1px solid var(--line)}
    .set-label{font-weight:900}.score{display:grid;grid-template-columns:auto auto auto auto auto;align-items:end;gap:8px;font-size:32px;font-weight:950}.score-team{font-size:13px}.our-color{color:var(--blue)}.their-color{color:var(--red)}
    .score-part{display:inline-block}.score-part.bump{transform:scale(1.25)}.point-status{min-width:84px;color:var(--yellow);font-size:11px;text-align:center}
    .serve-badge{padding:7px 13px;border-radius:999px;font-weight:900}.serve-badge.our{background:#176da9}.serve-badge.their{background:#a63b4b}
    .help{min-width:42px;border:1px solid #6d8cac;border-radius:50%;background:#173859;font-weight:950}
    .app{height:calc(100vh - 78px);min-width:900px;display:grid;grid-template-columns:28% 44% 28%;overflow:hidden}
    .side{min-width:0;padding:8px;display:flex;flex-direction:column;gap:6px;transition:filter .2s}.ours{background:rgba(18,106,176,.19);border-right:1px solid #297ec0}.theirs{background:rgba(167,49,67,.18);border-left:1px solid #9b4050}.side.dim{filter:brightness(.9)}.side h1{margin:0;text-align:center;font-size:18px}
    .actions{flex:1;min-height:0;display:grid;grid-template-rows:repeat(5,minmax(40px,1fr)) auto repeat(2,minmax(40px,1fr));gap:5px}
    .action{border:0;border-radius:10px;padding:4px 9px;font-size:clamp(13px,1.25vw,18px);line-height:1.14;font-weight:900}.ours .action{background:var(--blue2)}.theirs .action{background:var(--red2)}
    .action.secondary{border:1px solid #71869f;background:transparent}.action.unavailable{filter:grayscale(1);opacity:.38}.action-divider{border-top:1px solid #5f7188}
    .center{min-width:0;min-height:0;padding:7px 8px;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;gap:6px;background:#081f40}
    .card{border:1px solid var(--line);border-radius:10px;background:var(--panel)}.section-title{margin:0 0 4px;font-size:14px;color:#d9e9fa}
    .rotation-card{position:relative;padding:6px}.rotation-card.flash{border-color:var(--yellow);box-shadow:0 0 0 3px rgba(255,216,94,.35)}
    .rotation-badge{position:absolute;top:6px;right:7px;padding:2px 8px;border-radius:999px;background:var(--blue);color:#061a37;font-weight:950}
    .flipable{transform:scale(var(--fx,1),var(--fy,1))}.flipable .court-player,.flipable .slide-player,.flipable .wizard-slot,.flipable .opp-slot,.flipable .net-bar{transform:scale(var(--fx,1),var(--fy,1))}.flip-tools{display:flex;gap:6px;margin:0 0 6px}.flip-tools button{min-height:34px;padding:4px 10px;border:1px solid #6687aa;border-radius:8px;background:#173859;color:#fff;font:inherit;font-weight:900;font-size:12px}.flip-tools button.on{border-color:var(--yellow);background:#3a2f10;color:#ffe0a8}
    .court-labels{display:grid;grid-template-columns:1fr 1fr;margin-bottom:3px;text-align:center;color:var(--muted);font-size:11px;font-weight:900}
    .court{display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(3,40px);gap:3px 5px;position:relative}
    .court:after{content:"ネット";position:absolute;z-index:2;inset:0 auto 0 50%;display:grid;place-items:center;width:3px;transform:translateX(-50%);background:#f4f8fc;color:#597088;font-size:10px;writing-mode:vertical-rl}
    .court-player{position:relative;display:grid;place-items:center;padding:9px 2px 2px;border:1px solid #4385ba;border-radius:7px;background:#104875;text-align:center;font-size:13px;font-weight:900}.court-player.their-player{border-color:#a55361;background:#682937}.court-player.net-left{margin-right:4px}.court-player.net-right{margin-left:4px}.court-player.libero-slot{border-color:#e2ac42;background:#6c541d}.court-player small{display:block;color:#f8dc95;font-size:10px}.position-number{position:absolute;top:1px;left:4px;color:rgba(255,255,255,.55);font-size:10px}
    .court-notes{display:flex;justify-content:space-between;gap:8px;margin-top:3px;color:var(--muted);font-size:10px}.court-notes p{margin:0}
    .serve-order{padding:6px}.serve-chips{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}.serve-chip{position:relative;min-height:49px;display:grid;place-items:center;padding:14px 2px 2px;border:1px solid #54779e;border-radius:8px;background:#173b63;text-align:center;font-size:13px;font-weight:900}.serve-chip strong{font-size:15px}.serve-chip.active{border-color:#74c8ff;background:#165d92;box-shadow:inset 0 0 0 2px var(--blue)}.chip-badge{position:absolute;top:2px;left:50%;transform:translateX(-50%);padding:1px 4px;border-radius:999px;background:var(--yellow);color:#182231;white-space:nowrap;font-size:10px}
    .log-card{min-height:0;display:flex;flex-direction:column;padding:6px}.log{min-height:0;overflow-y:auto;margin:0;padding:0;list-style:none;font-size:12px}.log li{padding:4px 6px;border-bottom:1px solid rgba(80,116,154,.48)}.log li.system{color:var(--yellow);font-weight:800}.dot.our{color:var(--blue)}.dot.their{color:var(--red)}
    .operations{display:grid;gap:5px}.history-controls{display:grid;grid-template-columns:2fr 1fr;gap:5px}.operation-row{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.operations button{min-height:38px;border:1px solid #6687aa;border-radius:9px;background:#173859;font-size:12px;font-weight:900}.operations .dummy{filter:grayscale(1);opacity:.45}
    .backdrop{position:fixed;z-index:60;inset:0;display:none;place-items:center;padding:20px;background:rgba(0,8,23,.84)}.backdrop.show{display:grid}.modal{width:min(820px,94vw);max-height:90vh;overflow:auto;padding:17px;border:1px solid #638bb5;border-radius:15px;background:#0b274a}.modal h2{margin:0 0 6px}.modal-note{margin:0 0 11px;color:var(--muted);white-space:pre-line}.player-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.player-choice{border:1px solid #4385ba;border-radius:9px;background:#104875;font-weight:900}.player-choice .number{display:block;font-size:20px}.modal-footer{display:flex;justify-content:flex-end;gap:8px;margin-top:11px}.modal-footer button{border:0;border-radius:9px;background:#354b64;font-weight:900}.modal-footer button.primary{background:#176da9;font-size:inherit}.adjust-score{font-size:28px;text-align:center;font-weight:950}.adjust-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.help-copy{line-height:1.8}
    #toast{position:fixed;z-index:120;left:50%;bottom:110px;transform:translate(-50%,18px);min-width:360px;max-width:90vw;padding:11px 16px;border-radius:10px;background:#fff;color:#061a37;text-align:center;font-weight:900;white-space:pre-line;opacity:0;pointer-events:none;transition:.18s}#toast.show{opacity:1;transform:translate(-50%,0)}
    .set-overlay{position:fixed;z-index:70;inset:0;display:none;place-items:center;padding:20px;background:rgba(0,8,23,.92)}.set-overlay.show{display:grid}.set-panel{max-width:720px;padding:24px;border:1px solid #638bb5;border-radius:15px;background:#0b274a;text-align:center}.set-panel h2{margin:0 0 8px;font-size:27px}.set-panel p{color:var(--muted)}.set-panel button{margin:5px;border:1px solid #7995b2;border-radius:9px;background:#173859;font-weight:900}
    .screen{position:fixed;z-index:50;inset:0;overflow:auto;background:var(--bg);padding:24px}.screen[hidden],#recordShell[hidden]{display:none!important}.page{width:min(900px,100%);margin:auto}.page h1{margin-top:0}.page-card{margin:12px 0;padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}.page button,.page input,.page textarea{font:inherit}.primary,.secondary,.danger,.row-button{border:1px solid #6687aa;border-radius:10px;padding:10px 14px;background:#176da9;color:#fff;font-weight:900}.primary{font-size:20px}.secondary{background:#173859}.danger{background:#702b39}.toolbar{display:flex;flex-wrap:wrap;gap:8px}.match-row,.roster-row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.match-open{border:0;background:transparent;color:#fff;text-align:left}.muted{color:var(--muted)}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.form-grid label{display:grid;gap:5px}.form-grid input,.page textarea,.roster-row input,.opp-input{min-height:44px;border:1px solid #638bb5;border-radius:8px;padding:8px;background:#061a37;color:#fff}.pick-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.pick{border:1px solid #4385ba;border-radius:9px;background:#104875}.pick.selected{background:#176da9;box-shadow:inset 0 0 0 2px var(--yellow)}.wizard-court{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.wizard-slot{position:relative;min-height:68px;padding:17px 6px 6px;border:1px solid #4385ba;border-radius:9px;background:#104875}.court-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:6px;margin:0 0 6px;color:#bcdcff;font-size:12px;font-weight:900}.half-court{display:flex;gap:8px;align-items:stretch}.half-court.theirs{flex-direction:row-reverse}.court-cells{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:8px}.net-bar{flex:0 0 28px;display:grid;place-items:center;border-radius:6px;background:# ide-player.their{border-color:#a55361;background:#682937}.slide-player.libero{border-color:#e2ac42;background:#6c541d}.slide-player small{display:block;color:#f8dc95;font-size:9px}.slide-position{position:absolute;top:1px;left:4px;color:rgba(255,255,255,.55);font-size:9px}.slide-notes{margin:3px 0 0;color:var(--muted);font-size:10px}.slide-serve-chips{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}.slide-serve-chip{min-height:39px;display:grid;place-items:center;border:1px solid #54779e;border-radius:8px;background:#173b63;font-size:11px;font-weight:900}.slide-serve-chip.active{border-color:#74c8ff;background:#165d92}.slide-log-card{min-height:0;display:flex;flex-direction:column}.slide-log{min-height:0;overflow-y:auto;margin:0;padding:0;list-style:none;font-size:11px}.slide-log li{padding:4px 6px;border-bottom:1px solid rgba(80,116,154,.48)}.slide-log li.system{color:var(--yellow);font-weight:800}.portrait-note{display:none;position:fixed;z-index:100;inset:0;place-items:center;background:var(--bg);font-size:28px;font-weight:900}
    @media (max-width:1023px),(max-height:599px){body:has(#recordShell:not([hidden])){min-width:700px}.app{min-width:700px;grid-template-columns:26% 48% 26%}.court{grid-template-rows:repeat(3,34px)}.serve-chip{min-height:42px;font-size:11px}.action{font-size:13px}.topbar{height:52px}.app{height:calc(100vh - 52px)}}
    #slideContent{display:contents}
    #moreOps{display:none}
    @media (max-height:499px) and (orientation:landscape){body:has(#recordShell:not([hidden])){min-width:700px}.app{grid-template-columns:32% 36% 32%}.topbar{height:48px}.score{font-size:24px}.app{height:calc(100vh - 48px)}.center{grid-template-rows:auto minmax(0,1fr) auto}.rotation-card{cursor:pointer}.court-wrap,.court-notes,.serve-order{display:none}.log li:nth-child(n+3){display:none}.operations .history-controls{grid-template-columns:1fr}.operations #redo,.operations .operation-row button:not(#moreOps){display:none}.operations .operation-row{display:block}.operations #moreOps{display:block;width:100%}.operations button{min-height:40px;font-size:12px}.side{padding:4px}.actions{gap:3px}.action{min-height:40px}.side h1{font-size:14px}.point-status{display:none}.mode-badge{padding:1px 7px;font-size:10px}.modal{padding:11px}.modal h2{margin:0 0 3px;font-size:18px}.modal-note{margin:0 0 6px;font-size:12px}.modal-footer{margin-top:7px}.wizard-slot,.opp-slot{min-height:44px;padding:14px 6px 5px;font-size:13px}.court-cells{gap:5px}.court-head{margin-bottom:4px;font-size:11px}.modal .court-hint{display:none}.net-bar{flex-basis:22px;font-size:10px;letter-spacing:1px}}
    /* 2340x1080級のスマホ横＝URLバーぶんで7個目のボタンが画面外に出て、どこもスクロールしないため押せなくなる。行の下限を下げて必ず収める */
    @media (max-height:389px) and (orientation:landscape){.topbar{height:40px}.app{height:calc(100vh - 40px)}.score{font-size:20px}.actions{grid-template-rows:repeat(5,minmax(26px,1fr)) auto repeat(2,minmax(26px,1fr));gap:2px}.action{min-height:26px;font-size:12px}.side{padding:3px}.side h1{font-size:12px}.operations button{min-height:32px}}
    @media (max-width:599px) and (orientation:portrait){#recordShell:not([hidden])~.portrait-note{display:grid}}
    @media (max-width:650px){.screen{padding:14px}.pick-grid{grid-template-columns:repeat(2,1fr)}.form-grid{grid-template-columns:1fr}}
    .summary-page{width:min(1040px,100%)}.summary-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.summary-grid .wide{grid-column:1/-1}.summary-card{margin:0;padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}.summary-card h2{margin:0 0 10px;font-size:19px}.summary-table{width:100%;border-collapse:collapse}.summary-table th,.summary-table td{padding:7px 5px;border-bottom:1px solid var(--line);text-align:right}.summary-table th:first-child,.summary-table td:first-child{text-align:left}.weak-row{background:#6b5719}.point-bar{display:flex;height:30px;overflow:hidden;border-radius:8px;background:#25405e}.point-bar span{display:grid;place-items:center;min-width:0;font-weight:900}.point-bar .earned{background:#1676ba}.point-bar .given{background:#806428}.mini-gauge{display:inline-block;width:72px;height:8px;margin-left:5px;border-radius:9px;background:#294767;vertical-align:middle;overflow:hidden}.mini-gauge i{display:block;height:100%;background:#58c6ff}.mini-gauge.goal i{background:#72dc9b}.quality-note{color:var(--yellow)}.periods,.tabs{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0}.periods button.active,.tabs button.active{background:#176da9;box-shadow:inset 0 0 0 2px var(--yellow)}.trend{width:100%;height:auto;background:#092242;border-radius:8px}.trend text{fill:#dcecff;font-size:10px}.trend .axis{stroke:#708aa7;stroke-width:1}.trend .sideout-line{fill:none;stroke:#58c6ff;stroke-width:3}.trend .serve-line{fill:none;stroke:#72dc9b;stroke-width:3}.trend circle{stroke:#071b3a;stroke-width:2}.growth-up{padding:9px;margin:6px 0;border-radius:8px;background:#174f42}.summary-actions{margin:12px 0}.summary-note{margin:4px 0;color:var(--muted)}@media(max-width:700px){.summary-grid{grid-template-columns:1fr}.summary-grid .wide{grid-column:auto}.summary-table{font-size:13px}.screen{min-width:0}}@media print{*{color:#111!important;box-shadow:none!important}.screen{position:static;padding:0;background:#fff}.summary-page{width:100%;font-size:10px}.summary-page>.toolbar,.summary-actions,.periods,.tabs{display:none!important}.summary-grid{grid-template-columns:1fr 1fr;gap:5px}.summary-card{break-inside:avoid;padding:7px;border-color:#aaa;background:#fff}.summary-card h2{font-size:13px;margin-bottom:4px}.summary-table th,.summary-table td{padding:2px;border-color:#ccc}.point-bar,.trend{background:#eee!important}.point-bar .earned{background:#9ccff0!important}.point-bar .given{background:#ddd0a5!important}.weak-row{background:#fff2a8!important}}
  </style>
</head>
<body>
  <section id="homeScreen" class="screen"><div class="page">
    <h1>試合アシスタント</h1><div class="toolbar"><button id="newMatch" class="primary" type="button">＋ 新しい試合</button><button id="teamStats" class="secondary" type="button">📈 チームのきろく</button></div>
    <div class="page-card"><h2>試合一覧</h2><div id="matchList"></div></div>
    <div class="toolbar"><button id="openRoster" class="secondary" type="button">メンバー登録</button><button id="openData" class="secondary" type="button">データの書出し/読込み</button><button id="openSettings" class="secondary" type="button">設定</button></div>
    <p class="home-note">記録はこの端末の中だけに保存されます</p>
  </div></section>
  <section id="pageScreen" class="screen" hidden><div id="pageContent" class="page"></div></section>
  <div id="recordShell" hidden>
  <header class="topbar">
    <button id="recordHome" class="icon-button top-home" type="button" aria-label="ホーム">⌂</button>
    <span id="setLabel" class="set-label">セット1 ｜ 0-0</span><span id="modeBadge" class="mode-badge" hidden></span>
    <div class="score" aria-label="スコア">
      <span class="score-team our-color">うち</span><span id="ourScore" class="score-part our-color">0</span><span>-</span><span id="theirScore" class="score-part their-color">0</span><span class="score-team their-color">相手</span>
    </div>
    <span id="pointStatus" class="point-status"></span>
    <span id="serveBadge" class="serve-badge their">🏐 相手のサーブ</span>
    <button id="help" class="help" type="button" aria-label="ヘルプ">？</button>
  </header>
  <main id="app" class="app">
    <section id="ourSide" class="side ours"><h1>うちの得点</h1><div id="ourActions" class="actions"></div></section>
    <section class="center">
      <section id="rotationCard" class="card rotation-card">
        <h2 class="section-title">いまのローテ</h2><span id="rotationBadge" class="rotation-badge">ローテ 1</span>
        <div id="courtWrap" class="court-wrap"><div class="court-labels"><span>うち</span><span>相手</span></div><div id="court" class="court"></div></div>
        <div class="court-notes"><p id="liberoNote"></p><p><button id="editOpponent" type="button">相手番号</button></p></div>
      </section>
      <section class="card serve-order"><h2 class="section-title">サーブ順</h2><div id="serveChips" class="serve-chips"></div></section>
      <section class="card log-card"><h2 class="section-title">試合ログ</h2><ol id="log" class="log" aria-live="polite"></ol></section>
      <div class="operations">
        <div class="history-controls"><button id="undo" type="button" disabled>↩ 1つ戻す</button><button id="redo" type="button" disabled>↪ 戻すのを取消</button></div>
        <div class="operation-row"><button id="substitution" type="button">🔁 選手交代</button><button id="timeout" type="button">⏱ タイムアウト</button><button id="adjust" type="button">🔧 スコア合わせ</button><button id="reverse" type="button">⇄ 左右</button><button id="flipV" type="button">⇅ 上下</button><button id="moreOps" type="button">⋯ その他</button></div>
      </div>
    </section>
    <section id="theirSide" class="side theirs"><h1>相手の得点</h1><div id="theirActions" class="actions"></div></section>
  </main>
  </div>
  <div id="setOverlay" class="set-overlay" role="dialog" aria-modal="true" aria-labelledby="setEndText" aria-describedby="setEndNote"><div class="set-panel"><h2 id="setEndText"></h2><p id="setEndNote">このセットを記録します</p><button id="continue" type="button">セットを記録して次へ</button><button id="overlayUndo" type="button">↩ 1つ戻す</button></div></div>
  <div id="modalBackdrop" class="backdrop" role="dialog" aria-modal="true" aria-labelledby="modalTitle">

    let state=clone(initialState),undoStack=[],redoStack=[],modalOrigin=null,modalCancel=null,modalNoPlayer=null,modalKind='score',modalPrimaryAction=null,lineupDraft=null,toastTimer=0,lastPointAt=0,courtReversed=false,setDismissed=false,setOverlayOpen=false,setOverlayOrigin=null;

    }
    function renderServeOrder(){const marked=state.ourServe?state.order[0]:state.order[1];$('#serveChips').replaceChildren(...state.order.map(n=>{const chip=document.createElement('div');chip.className=`serve-chip${n===marked?' active':''}`;if(n===marked){const badge=document.createElement('span');badge.className='chip-badge';badge.textContent=state.ourServe?'🏐サーブ中':'🏐つぎ';chip.append(badge)}const strong=document.createElement('strong');strong.textContent=`#${n}`;chip.append(strong,document.createTextNode(players[n]));return chip}))}

    function setTarget(){return(currentMatch?.setPoints||DEFAULT_SETTINGS.setPoints)[(currentMatch?.currentSet||1)-1]||25}

    }
    function openModal({title,note,numbers=[],onChoose,noPlayer=null,content=null,onCancel=null,kind='score',preserveOrigin=false,choiceLabel=null,primaryLabel=null,onPrimary=null}){
      if(!preserveOrigin)modalOrigin=document.activeElement;modalKind=kind;modalCancel=onCancel;modalNoPlayer=noPlayer;modalPrimaryAction=onPrimary;$('#modalTitle').textContent=title;$('#modalNote').textContent=note;const grid=$('#modalGrid');grid.className='player-grid';grid.replaceChildren();

    function closeModal(cancelled=false){if(!$('#modalBackdrop').classList.contains('show'))return;$('#modalBackdrop').classList.remove('show');syncInert();const origin=modalOrigin,cancel=modalCancel;modalOrigin=null;modalCancel=null;modalNoPlayer=null;modalPrimaryAction=null;if(cancelled){cancel?.();if(modalKind==='score')showToast('記録していません（点は入っていません）')}origin?.focus()}

    function validateImport(obj){if(!isObject(obj)||obj.format!=='VBM1'||obj.version!==1||!Array.isArray(obj.matches)||!Array.isArray(obj.roster)||!Array.isArray(obj.settings))throw Error('format');const unique=(items,key)=>{const keys=items.map(x=>x[key]);if(keys.some(k=>k==null)||new Set(keys).size!==keys.length)throw Error('key')};unique(obj.matches,'id');unique(obj.roster,'number');unique(obj.settings,'key');for(const r of obj.roster)if(!isObject(r)||!validNumber(r.number)||typeof r.name!=='string')throw Error('roster');for(const s of obj.settings)if(!isObject(s)||!validKey(s.key)||!Array.isArray(s.setPoints)||!s.setPoints.length||s.setPoints.some(n=>!validNumber(n)||n<1))throw Error('settings');for(const m of obj.matches){if(!isObject(m)||!validKey(m.id)||typeof m.date!=='string'||!validNumber(m.createdAt)||!Array.isArray(m.entry)||!Array.isArray(m.sets)||!validNumber(m.currentSet)||typeof m.finished!=='boolean')throw Error('match');for(const set of m.sets){if(!isObject(set)||!validNumber(set.setNo)||!validNumber(set.ourScore)||!validNumber(set.theirScore)||!Array.isArray(set.startingOrder)||set.startingOrder.length!==6||!Array.isArray(set.order)||set.order.length!==6||!Array.isArray(set.oppOrder)||set.oppOrder.length!==6||!Array.isArray(set.events))throw Error('set');for(const e of set.events)if(!isObject(e)||!validNumber(e.seq)||!validNumber(e.set)||typeof e.type!=='string'||!['our','their'].includes(e.side)||typeof e.actionId!=='string'||!Array.isArray(e.scoreAfter)||e.scoreAfter.length!==2||e.scoreAfter.some(n=>!validNumber(n)))throw Error('event')}}return obj}
    async function importPayload(obj){const resetSettings=obj.settings.length?obj.settings:[clone(DEFAULT_SETTINGS)];await dbTransaction(['matches','roster','settings'],tx=>{for(const name of ['matches','roster','settings'])tx.objectStore(name).clear();obj.matches.forEach(x=>tx.objectStore('matches').put(x));obj.roster.forEach(x=>tx.objectStore('roster').put(x));resetSettings.forEach(x=>tx.objectStore('settings').put(x))})}
    async function showData(){const payload=await exportPayload();page('データの書出し/読込み',`<div class="page-card"><label>書出し<textarea id="dataText" rows="8">${payload}</textarea></label><div class="toolbar"><button id="copyData" class="primary">コピー</button></div></div><div class="page-card"><label>読込み<textarea id="importText" rows="6" placeholder="VBM1:から始まる文字列"></textarea></label><button id="importData" class="danger">貼り付けたデータで上書き</button></div>`);$('#copyData').onclick=async()=>{await navigator.clipboard.writeText($('#dataText').value);showToast('コピーしました')};let armed=false;$('#importData').onclick=async e=>{if(!armed){armed=true;e.target.textContent='ほんとうに上書き';return}try{const raw=$('#importText').value.trim();if(!raw.startsWith('VBM1:'))throw Error();const obj=validateImport(JSON.parse(decodeURIComponent(escape(atob(raw.slice(5))))));await importPayload(obj);await loadBase();showToast('読み込みました');showHome()}catch(error){console.warn('VBM1 import failed',error);showToast('読み込めないデータです（元のデータは無事です）')}}}
    async function exportPayload(){const obj={format:'VBM1',version:1,matches:await dbAll('matches'),roster:await dbAll('roster'),settings:await dbAll('settings')};return'VBM1:'+btoa(unescape(encodeURIComponent(JSON.stringify(obj))))}
    function showSettings(){page('設定',`<div class="page-card"><h2>セット構成</h2><div class="form-grid">${settings.setPoints.map((n,i)=>`<label>第${i+1}セット<input class="set-point" type="number" min="1" value="${n}"></label>`).join('')}</div><button id="saveSettings" class="primary">保存</button></div><div class="page-card"><h2>記録の深さ</h2><p>かんたん（固定）</p><p class="muted">ふつう・くわしいは今後追加します</p></div>`);$('#saveSettings').onclick=async()=>{const next={key:'main',setPoints:[...document.querySelectorAll('.set-point')].map(x=>Math.max(1,Number(x.value)||1))};try{await dbPut('settings',next);settings=next;showToast('保存しました')}catch(error){saveFailed(error)}}}
    initActions();$('#substitution').addEventListener('click',beginSubstitution);$('#timeout').addEventListener('click',beginTimeout);$('#adjust').addEventListener('click',openAdjust);$('#reverse').addEventListener('click',()=>{setFlip('h',!flipH);render();showToast('コートの向きを左右いれかえました')});$('#flipV').addEventListener('click',()=>{setFlip('v',!flipV);render();showToast('コートの向きを上下いれかえました')});$('#moreOps').addEventListener('click',()=>openModal({kind:'info',title:'その他の操作',note:'操作を選んでください',content:grid=>{for(const [text,id] of [['↪ 戻すのを取消','redo'],['🔁 選手交代','substitution'],['⏱ タイムアウト','timeout'],['🔧 スコア合わせ','adjust'],['⇄ コート左右','reverse'],['⇅ コート上下','flipV'],['相手番号','editOpponent']]){const b=document.createElement('button');b.className='player-choice';b.textContent=text;b.onclick=()=>{closeModal();$(`#${id}`).click()};grid.append(b)}}}));$('#undo').addEventListener('click',undo);$('#redo').addEventListener('click',redo);$('#overlayUndo').addEventListener('click',undo);$('#continue').addEventListener('click',finishSet);$('#recordHome').addEventListener('click',async()=>{await saveCurrent();showHome()});$('#newMatch').addEventListener('click',startWizard);$('#teamStats').addEventListener('click',showCumulative);$('#openRoster').addEventListener('click',showRoster);$('#openData').addEventListener('click',showData);$('#openSettings').addEventListener('click',showSettings);
    $('#editOpponent').addEventListener('click',()=>openModal({kind:'info',title:`${sideName(currentMatch,'their')}の番号`,note:'左のたて線がネット。P1＝最初にサーブを打つ位置',content:grid=>{grid.className='';const wrap=halfCourt('theirs','oppLiveFields');grid.append(wrap);for(const [pos,role] of THEIR_COURT){const cell=document.createElement('div');cell.className='opp-slot';cell.append(roleTag(role));const cap=document.createElement('span');cap.className='slot-role';cap.style.left='auto';cap.style.right='7px';cap.textContent=`P${pos}`;cell.append(cap);const input=document.createElement('input');input.type='number';input.className='opp-live';input.dataset.pos=String(pos);input.value=state.opponentOrder[pos-1]||'';input.setAttribute('aria-label',`P${pos}（${role}）の背番号`);cell.append(input);$('#oppLiveFields').append(cell)}const b=document.createElement('button');b.className='player-choice';b.style.marginTop='10px';b.textContent='反映';b.onclick=()=>{const next=[...state.opponentOrder];document.querySelectorAll('.opp-live').forEach(x=>{next[Number(x.dataset.pos)-1]=x.value?Number(x.value):''});state.opponentOrder=next;closeModal();render();saveCurrent()};grid.append(b)}}));
    function renderSlideOver(){
      const root=$('#slideContent');root.replaceChildren();const rotation=document.createElement('section');rotation.className='slide-panel-card';rotation.innerHTML=`<h2 class="section-title">いまのローテ　ローテ ${state.rotation}</h2>`;const court=document.createElement('div');court.className='slide-court';const cells=[['our',5,4],['our',4,3],['their',2,1],['their',1,0],['our',6,5],['our',3,2],['their',3,2],['their',6,5],['our',1,0],['our',2,1],['their',4,3],['their',5,4]];for(const [side,pos,index] of cells){const n=side==='our'?state.order[index]:state.opponentOrder[index],lib=side==='our'&&currentMatch?.libero&&n===state.liberoPartner&&(pos===5||pos===6),box=document.createElement('div');box.className=`slide-player${side==='their'?' their':''}${lib?' libero':''}`;const p=document.createElement('span');p.className='slide-position';p.textContent=`P${pos}`;box.append(p);if(lib){box.append(document.createTextNode(`${label(currentMatch.libero)}(L)`));const small=document.createElement('small');small.textContent=`⇄ ${label(n)}`;box.append(small)}else box.append(document.createTextNode(`${side==='our'?label(n):n?`#${n}`:'?'}${((side==='our'&&state.ourServe)||(side==='their'&&!state.ourServe))&&pos===1?' 🏐':''}`));court.append(box)}orient(court,courtReversed);rotation.append(court);const note=document.createElement('p');note.className='slide-notes';note.textContent=currentMatch?.libero?`リベロは ${label(state.liberoPartner)} がP5・P6にいる間だけ ${label(currentMatch.libero)} と表示します`:'リベロなし';rotation.append(note);
      const serve=document.createElement('section');serve.className='slide-panel-card';serve.innerHTML='<h2 class="section-title">サーブ順</h2>';const chips=document.createElement('div');chips.className='slide-serve-chips';const marked=state.ourServe?state.order[0]:state.order[1];for(const n of state.order){const chip=document.createElement('div');chip.className=`slide-serve-chip${n===marked?' active':''}`;chip.textContent=`#${n} ${players[n]||''}${n===marked?state.ourServe?' 🏐':' つぎ':''}`;chips.append(chip)}serve.append(chips);
      const logCard=document.createElement('section');logCard.className='slide-panel-card slide-log-card';logCard.innerHTML='<h2 class="section-title">試合ログ</h2>';const log=document.createElement('ol');log.className='slide-log';for(const e of state.logs){const li=document.createElement('li');li.className=e.system?'system':'';li.textContent=e.system?e.text:`${e.score} ${e.side==='our'?'●':'○'} ${e.text}`;log.append(li)}logCard.append(log);root.append(rotation,serve,logCard)
    }
    $('#rotationCard').addEventListener('click',()=>{if(innerHeight>=500)return;renderSlideOver();$('#slideOver').classList.add('show')});$('#closeSlide').onclick=()=>$('#slideOver').classList.remove('show');$('#slideOver').onclick=e=>{if(e.target===$('#slideOver'))$('#slideOver').classList.remove('show')};
    $('#help').addEventListener('click',()=>openModal({kind:'info',title:'記録の割り切りルール',note:'・サーブで相手がくずれて落ちたら全部「サーブエース」\n・うちのアタックが止められたら「ブロックされた」\n・ボールにさわれず決められたら「相手に決められた」\n・さわってからのミスは「うちのレシーブ・つなぎミス」\n・相手のサーブがネットやアウト→「相手のサーブミス」（それ以外の相手の反則・アウトは「相手のミス」）\n・うちの反則（ダブルコンタクトなど）は「その他で得点」（相手の列）\n・スコアがズレて、どっちの点か分かるなら「見逃した」、分からないときは🔧スコア合わせ\n・迷ったら近い方でOK。スコアは正しく入るし、あとで直せる\n・サーブがどっちか画面とちがうときは、🔧スコア合わせの「いまのサーブ」で直せるよ'}));
    $('#modalClose').addEventListener('click',()=>closeModal(modalKind==='score'||!!modalCancel));$('#modalPrimary').addEventListener('click',()=>modalPrimaryAction?.());$('#noPlayer').addEventListener('click',()=>modalNoPlayer?.());$('#modalBackdrop').addEventListener('click',e=>{if(e.target===$('#modalBackdrop'))closeModal(modalKind==='score'||!!modalCancel)});document.addEventListener('keydown',e=>{const setOpen=$('#setOverlay').classList.contains('show'),modalOpen=$('#modalBackdrop').classList.contains('show');if(e.key==='Escape'&&modalOpen&&!setOpen)closeModal(modalKind==='score'||!!modalCancel);if(e.key==='Tab'&&(modalOpen||setOpen)){const root=setOpen?$('#setOverlay'):$('#modalBackdrop'),items=[...root.querySelectorAll('button:not([hidden])')];if(!items.length)return;const first=items[0],last=items.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
    window.matchState=()=>({state,currentMatch});(async()=>{try{await loadBase();await showHome();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(console.warn)}catch(error){console.warn(error);alert('保存の準備ができませんでした')}})();
  </script>
</body>
